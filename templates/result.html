<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - Your Comic</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            text-align: center;
        }

        h2 {
            color: #6c5ce7;
        }

        .details {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .detail {
            padding: 10px;
            background: #f7f7fb;
            border-radius: 6px;
        }

        .story {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #444;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            background: #6c5ce7;
        }

        .button.secondary {
            background: #555;
        }

        .button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🎨 {{ comic.title }}</h1>

        <h2>Comic Details</h2>

        <div class="details">

            <div class="detail">
                <strong>👤 Character:</strong>
                {{ comic.character }}
            </div>

            <div class="detail">
                <strong>📍
